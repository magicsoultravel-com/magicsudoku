<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Sudoku</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="quote-splash" class="quote-splash" hidden aria-live="polite">
    <blockquote id="quote-text" class="quote-text"></blockquote>
    <cite id="quote-author" class="quote-author"></cite>
  </div>

  <div class="app">
    <header class="header">
      <h1 class="title zen-hide">Magic Sudoku</h1>
      <div class="menu-row">
        <button id="btn-menu" class="btn btn-icon menu-toggle" type="button" aria-label="Menu" aria-expanded="false" title="Menu">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-zen" class="btn btn-icon zen-toggle" type="button" aria-label="Zen mode" title="Zen mode — focus on the puzzle">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5.2 6.4c.45-.45 1.05-.45 1.5 0M9.3 6.4c.45-.45 1.05-.45 1.5 0" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M5.5 10.2c1.15 1 3.85 1 5 0" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-zen-exit" class="btn btn-icon zen-exit" type="button" aria-label="Exit zen mode" title="Exit zen mode">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5.2 6.4c.45-.45 1.05-.45 1.5 0M9.3 6.4c.45-.45 1.05-.45 1.5 0" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M5.5 10.2c1.15 1 3.85 1 5 0" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav id="nav-menu" class="menu-overlay" hidden aria-label="Game menu">
      <div class="menu-icons">
        <button id="btn-lessons" class="btn btn-icon" type="button" aria-label="Lessons and tips" title="Lessons & tips">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7l3 3V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M10 2.5V6H13" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 8.5h5M5.5 10.5h3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-seeds" class="btn btn-icon" type="button" aria-label="Puzzle seeds" title="Puzzle seeds">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5h6v2a4 4 0 0 1-6 0v-2z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 9.5v3M6.5 12.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-settings" class="btn btn-icon" type="button" aria-label="Appearance settings" title="Appearance">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 4.85A3.15 3.15 0 1 0 8 11.15 3.15 3.15 0 0 0 8 4.85zm4.78 1.93 1.1-.82-.82-1.43-1.28.47a4.6 4.6 0 0 0-1.1-.64l-.22-1.34H7.24l-.22 1.34c-.39.18-.75.38-1.1.64l-1.28-.47-.82 1.43 1.1.82a4.5 4.5 0 0 0-.02 1.28l-1.1.82.82 1.43 1.28-.47c.35.26.71.46 1.1.64l.22 1.34h1.52l.22-1.34c.39-.18.75-.38 1.1-.64l1.28.47.82-1.43-1.1-.82a4.5 4.5 0 0 0 .02-1.28z"/></svg>
        </button>
        <button id="btn-restart" class="btn btn-icon" type="button" aria-label="Restart puzzle" title="Restart puzzle">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 4.5V2.5h-2M3 11.5v2h2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 6.5a5 5 0 0 1 8.2-1.8L13 4.5M12 9.5a5 5 0 0 1-8.2 1.8L3 11.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-new" class="btn btn-icon" type="button" aria-label="New game" title="New game">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5.75" cy="5.75" r=".75" fill="currentColor"/><circle cx="10.25" cy="10.25" r=".75" fill="currentColor"/><path d="M10 3.5v2.5h2.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="menu-selects">
        <select id="difficulty" class="select" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <select id="theme-select" class="select select-theme" aria-label="Theme">
          <option value="dark" selected>Dark</option>
          <option value="light">Light</option>
          <option value="slate">Slate</option>
          <option value="ocean">Ocean</option>
          <option value="dusk">Dusk</option>
        </select>
      </div>
      </nav>
    </header>

    <div id="menu-scrim" class="menu-scrim" hidden aria-hidden="true"></div>

    <div id="timer" class="timer zen-hide" aria-live="off">0:00</div>

    <main class="main">
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
      </div>

      <div class="controls bottom-interface">
          <div id="numpad" class="numpad" role="group" aria-label="Number pad"></div>
          <div class="action-row">
            <button id="btn-undo" class="btn btn-icon" type="button" aria-label="Undo" title="Undo" disabled>
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9.5a3 3 0 1 0 0-6H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 5L3 8l3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-redo" class="btn btn-icon" type="button" aria-label="Redo" title="Redo" disabled>
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3.5a3 3 0 1 1 0-6H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 5l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-pencil" class="btn btn-icon" type="button" aria-label="Pencil marks" title="Pencil marks">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.5 2.5l2 2-8 8H3.5v-2l8-8z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M10 4l2 2" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button id="btn-erase" class="btn btn-icon" type="button" aria-label="Erase" title="Erase">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 9.5l5-5 5 5-5 5-5-5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M2.5 13.5h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-check" class="btn btn-icon" type="button" aria-label="Check" title="Check">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-pencil-fill" class="btn btn-icon" type="button" aria-label="Fill all pencil marks" title="Fill all pencil marks">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="5.5" cy="5.5" r=".65" fill="currentColor"/><circle cx="8" cy="5.5" r=".65" fill="currentColor"/><circle cx="10.5" cy="5.5" r=".65" fill="currentColor"/><circle cx="5.5" cy="8" r=".65" fill="currentColor"/><circle cx="8" cy="8" r=".65" fill="currentColor"/><circle cx="10.5" cy="8" r=".65" fill="currentColor"/><circle cx="5.5" cy="10.5" r=".65" fill="currentColor"/><circle cx="8" cy="10.5" r=".65" fill="currentColor"/><circle cx="10.5" cy="10.5" r=".65" fill="currentColor"/></svg>
            </button>
            <button id="btn-pencil-clear" class="btn btn-icon" type="button" aria-label="Clear all pencil marks" title="Clear all pencil marks">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 11.5l4.5-4.5 5.5 5.5-2 2H2.5v-3z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M7 7l2-2 4 4-2 2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M2.5 13.5h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
    </main>

    <footer class="footer zen-hide">
      <span id="status" class="status" role="status"></span>
    </footer>
  </div>

  <dialog id="confirm-dialog" class="dialog confirm-dialog">
    <div class="dialog-body">
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn" type="button">Cancel</button>
        <button id="confirm-ok" class="btn btn-primary" type="button">Confirm</button>
      </div>
    </div>
  </dialog>

  <dialog id="appearance-dialog" class="dialog appearance-dialog">
    <div class="dialog-header">
      <h2 class="dialog-title">Appearance</h2>
      <button id="settings-close" class="btn btn-icon" type="button" aria-label="Close appearance">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="settings-colors" class="dialog-body appearance-body"></div>
  </dialog>

  <dialog id="lessons-dialog" class="dialog">
    <div class="dialog-header">
      <h2 class="dialog-title">Lessons &amp; tips</h2>
      <button id="lessons-close" class="btn btn-icon" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dialog-tabs" role="tablist">
      <button id="tab-basics" class="tab active" type="button" role="tab" aria-selected="true" data-tab="basics">Basics</button>
      <button id="tab-advanced" class="tab" type="button" role="tab" aria-selected="false" data-tab="advanced">Advanced</button>
    </div>
    <div id="lessons-basics" class="dialog-body tab-panel" role="tabpanel"></div>
    <div id="lessons-advanced" class="dialog-body tab-panel" role="tabpanel" hidden></div>
  </dialog>

  <dialog id="seeds-dialog" class="dialog">
    <div class="dialog-header">
      <h2 class="dialog-title">Puzzle seeds</h2>
      <button id="seeds-close" class="btn btn-icon" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dialog-body">
      <p class="dialog-hint">Same seed + difficulty always gives the same puzzle. Cleared if you wipe browser data.</p>
      <div class="seeds-current">
        <span class="seeds-label">Current</span>
        <span id="current-seed" class="current-seed">—</span>
      </div>
      <p class="seeds-label">Last 10</p>
      <ol id="seed-list" class="seed-list" aria-label="Last 10 seeds"></ol>
    </div>
  </dialog>

  <script src="js/sudoku.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
