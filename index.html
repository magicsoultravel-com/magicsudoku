<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Sudoku</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">Sudoku</h1>
      <div class="header-actions">
        <select id="difficulty" class="select" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="theme-toggle" class="btn btn-icon" type="button" aria-label="Toggle theme" title="Toggle theme">
          <span class="icon-sun" aria-hidden="true">☀</span>
          <span class="icon-moon" aria-hidden="true">☽</span>
        </button>
      </div>
    </header>

    <main class="main">
      <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>

      <div class="controls">
        <div id="numpad" class="numpad" role="group" aria-label="Number pad"></div>
        <div class="action-row">
          <button id="btn-erase" class="btn" type="button">Erase</button>
          <button id="btn-check" class="btn" type="button">Check</button>
          <button id="btn-new" class="btn btn-primary" type="button">New</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span id="status" class="status" role="status"></span>
      <span id="timer" class="timer">0:00</span>
    </footer>
  </div>

  <script src="js/sudoku.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
